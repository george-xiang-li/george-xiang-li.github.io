<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ page.description | default: site.description | escape }}" />
  <meta name="theme-color" content="#0d1512" />
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}" />
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}" />
  <meta property="og:type" content="website" />
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml" />
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="George Xiang Li home">
      {% if site.data.site.logo %}
      <img class="brand-logo" src="{{ site.data.site.logo | relative_url }}" alt="George Xiang Li logo" />
      {% else %}
      <span class="brand-mark">GXL</span>
      {% endif %}
      <span class="brand-name">{{ site.data.site.name }}</span>
    </a>
    <nav aria-label="Primary navigation">
      <a href="{{ '/#projects' | relative_url }}">Projects</a>
      <a href="{{ '/#process' | relative_url }}">Process</a>
      <a href="{{ '/#about' | relative_url }}">About</a>
    </nav>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer>
    <div class="section-shell footer-inner">
      <div>
        <strong>{{ site.data.site.name }}</strong>
        <p>{{ site.data.site.footer_line }}</p>
      </div>
      <p>{{ site.data.site.footer_note }}</p>
    </div>
  </footer>
  <script src="{{ '/assets/js/script.js' | relative_url }}"></script>
</body>
</html>
